  <script>
    (function () {
      try {
        var s = JSON.parse(localStorage.getItem('dc.settings') || '{}');
        var r = document.documentElement;
        if (s.theme) r.setAttribute('data-theme', s.theme);
        if (s.size) r.setAttribute('data-size', s.size);
        if (s.font) r.setAttribute('data-font', s.font);
        if (s.motion === 'off') r.setAttribute('data-motion', 'off');
      } catch (e) {}
    })();
  </script>
